# The five values. Fill them in, then run bin/kickoff.
# Format is deliberately flat "key: value" — no YAML library needed.

# The product's name, as a human says it. Example: Go Meal
project_name: My Project

# owner/repo on GitHub. Example: romain-nicod/go-meal
repo: owner/repo

# One sentence: what the product does, for whom. It lands in the README
# and in the repository description.
tagline: One sentence saying what this does and for whom.

# Stack layer: rails, static, or none.
stack: rails

# Absolute path of the project's folder in the vault. It lands on the
# first line of AGENTS.md. Example:
# /Users/albert/Documents/Claude/ObsiClaud/perso/pef/blog/
vault_folder:
