name: CI

# The checks of the delivery method (§ 4.3, § 4.4): lint, security, the
# Minitest suite AND the browser tests. No pull request until all are
# green on its last commit.

# 🔴 ONE run per branch (method § 6 ter). Without this, every push starts
# a fresh run and the superseded ones keep going to the end: 47 runs in a
# single day on AGROMALIBIO, for a plan that includes 3 000 minutes a
# month. On `main` nothing is cancelled: the merged commit is verified to
# the end.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Paths with no executable code: documentation, delivery screenshots,
# issue templates. ⚠️ A check that must run on a documentation-only pull
# request — the template placeholder gate, for instance — belongs in its
# own workflow, WITHOUT this filter: a placeholder hole appears exactly
# there.
on:
  pull_request:
    paths-ignore: &ignored
      - "docs/**"
      - "**/*.md"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/PULL_REQUEST_TEMPLATE/**"
      - "LICENSE"
  push:
    branches: [ main ]
    paths-ignore: *ignored

jobs:
  # 🔴 ONE job for everything that needs neither a database nor a browser
  # (method § 6 ter): each extra job pays another checkout and another
  # `bundle install`, billed every single run.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # A .gitignore that lost Rails' runtime rules fails at nothing: the
      # repository just starts carrying tmp/, log/ and storage/ — and the
      # key that decrypts the credentials. Cheapest check of the pipeline,
      # first on purpose.
      - name: No generated or secret file is tracked
        run: |
          tracked=$(git ls-files log tmp storage public/assets .bundle 'config/*.key' \
                    | grep -v '\.keep$' || true)
          if [ -n "$tracked" ]; then
            echo "$tracked"
            # No backtick in this message: inside double quotes the
            # shell would run what it encloses.
            echo '::error::These files are generated or secret and must not be tracked. Restore the Rails runtime rules in .gitignore, then untrack them with git rm -r --cached. A key that was committed has to be rotated at the source, not just removed.'
            exit 1
          fi
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - name: Lint
        run: bin/rubocop --parallel
      - name: Scan the application code
        run: bin/brakeman --no-pager
      - name: Audit the dependencies
        run: bundle exec bundler-audit --update
      - name: Audit browser dependencies
        run: bin/importmap audit

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
        ports: [ "5432:5432" ]
        options: >-
          --health-cmd "pg_isready"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      RAILS_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      # If the Gemfile loads image_processing or ruby-vips, Rails does not
      # boot without libvips: add, before this step,
      #   sudo apt-get update -qq && sudo apt-get install -y libvips42
      # Schema only, never db:prepare: the seeds belong to the recette,
      # the fixtures to the tests.
      - name: Prepare the database
        run: bin/rails db:create db:schema:load
      - name: Test
        run: bin/rails test

  # Browser tests: headless Chrome, real CSS and JavaScript, the job's own
  # synthetic database, no email and no production access. Chrome is
  # preinstalled on ubuntu-latest; Selenium Manager fetches the matching
  # chromedriver.
  system_test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
        ports: [ "5432:5432" ]
        options: >-
          --health-cmd "pg_isready"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      RAILS_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - name: Show the browser version
        run: google-chrome --version
      - name: Prepare the database
        run: bin/rails db:create db:schema:load
      - name: System tests
        run: bin/rails test:system
      - name: Keep failure screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: system-test-screenshots
          path: tmp/screenshots
          if-no-files-found: ignore
