name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - name: Lint
        run: bin/rubocop --parallel

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - name: Scan the application code
        run: bin/brakeman --no-pager
      - name: Audit the dependencies
        run: bundle exec bundler-audit --update

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
        ports: [ "5432:5432" ]
        options: >-
          --health-cmd "pg_isready"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      RAILS_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      # 🔴 db:test:prepare, never db:prepare. db:prepare LOADS THE SEEDS,
      # and seeds that read a key with ENV.fetch (golden rule 28) die in
      # CI on a KeyError at the bottom of a rake trace — where nothing
      # says the cause is the seeds. db:test:prepare loads the schema and
      # nothing else, which is all a test run needs.
      - name: Prepare the test database
        run: bin/rails db:test:prepare
      - name: Test
        run: bundle exec rspec
