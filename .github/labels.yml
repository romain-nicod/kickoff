# The labels this repository declares, created by scripts/setup_repo.py.
# Their meaning, and when each one is applied: docs/LABELS.md.
#
# The first four come from the delivery method and are the same on every
# project. The issue templates apply them; a label missing from the
# repository is silently dropped by GitHub, so this file must be applied
# before the first issue is opened.

- name: "type:user-story"
  color: "1D76DB"
  description: "User story [US] — the only issues Romain reviews"
- name: "Task"
  color: "C5DEF5"
  description: "Concrete action of a user story, filed as its sub-issue"
- name: "type:bug"
  color: "B60205"
  description: "Defect [BUG] — reviewed by Romain, same cycle as a user story"
- name: "à revoir par Romain"
  color: "FBCA04"
  description: "Created by the agent, waiting for Romain's review before Ready"

# Stopped by something outside the story. The board has no status for it:
# without this label a blocked story looks exactly like work in progress.
- name: "status:blocked"
  color: "FF8A3D"
  description: "Stopped by something outside the story — say what, in a comment"
