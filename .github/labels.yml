# The labels this repository declares by hand.
#
# It is short on purpose, and it is NOT the whole label set. Read
# docs/LABELS.md first — it states the naming convention, the six
# families and the rule that decides whether a thing deserves a label at
# all. This file is the machine-readable half of that document.
#
# ── What is here, and what is not ────────────────────────────────────────
#
# HERE: the labels a human applies. Nothing generates them, so they must
# be declared, and they are the same on every project.
#
# NOT HERE: `epic:`, `prio:`, `pts:` and `batch:` — those are GENERATED
# by scripts/create_issues.py from the specification, and only the values
# the specification actually uses are created. Declaring them here too
# produced empty labels on every project (a `batch:B5` on a three-batch
# plan) and two descriptions for the same label. The specification is the
# source; a label is its shadow.
#
# ── The convention, in one line ──────────────────────────────────────────
#
# `family:value`. Always. No bare label — a label with no family is a
# label nobody filters on, and it is how GitHub's own stock set became
# nine words nobody chose.

# ── Type — what kind of work this issue is ───────────────────────────────
# A user story carries no type: it is recognisable by its epic, priority,
# points and batch. These three are for what the specification did not
# generate.
- name: "type:bug"
  color: "17130E"
  description: "Behaves differently from its acceptance criteria"
- name: "type:chore"
  color: "17130E"
  description: "Technical work carrying no user story"
- name: "type:spike"
  color: "17130E"
  description: "Time-boxed investigation that answers one question"

# ── Status — the one thing the board cannot say ──────────────────────────
# The board's Status field has Backlog · Ready · In progress · In review ·
# Done. None of them means "stopped, and not by us". Without this label a
# blocked story sits in `In progress` looking exactly like work.
- name: "status:blocked"
  color: "FF8A3D"
  description: "Stopped by something outside the story — say what, in a comment"
