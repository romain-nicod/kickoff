  - name: Golden rules
    url: https://github.com/{{REPO}}/blob/main/GOLDEN_RULES.md
    about: How we write code here. A blocked pull request names the rule by its number.

  - name: Definition of Ready and Done
    url: https://github.com/{{REPO}}/blob/main/DOR_DOD.md
